name: Launcher checks

on: [push, pull_request]

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '8'
      - run: python -W error -B -m unittest discover -v
      - run: bash -n jviewer-docker.sh
        if: runner.os == 'Linux'
